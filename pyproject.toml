[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiopenstudio"
dynamic = ["version"]
description = "Desktop runner for local AI model suites"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.4,<3",
    "SQLAlchemy>=2.0,<3",
    "ollama>=0.6.2,<1",
    "httpx>=0.27,<1",
    "psutil>=6,<8",
    "nvidia-ml-py>=12,<14",
    "Pillow>=10,<13",
    "platformdirs>=4,<5",
    "python-dotenv>=1,<2",
]

[project.scripts]
aiopenstudio = "aiopenstudio.app:main"

[project.optional-dependencies]
gpu = [
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "torchaudio==2.11.0+cu128",
]
models = [
    "transformers>=5.14,<6",
    "huggingface-hub>=1.24,<2",
    "accelerate>=1.14,<2",
    "safetensors>=0.8,<1",
    "sentencepiece>=0.2.2,<1",
    "numpy>=2,<3",
    "soundfile>=0.13,<1",
]
postgres = ["psycopg[binary]>=3.2,<4"]
vector = ["sqlite-vec==0.1.9"]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[tool.setuptools.dynamic]
version = {attr = "aiopenstudio.__version__"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "ollama_integration: read-only checks against an explicitly enabled local Ollama server",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["aiopenstudio"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
